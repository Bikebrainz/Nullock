name: 'Nullock Security Gate'
description: >-
  Run the Nullock headless deep-audit against a URL and fail the job when a
  finding at or above a severity threshold is present (a CI security gate).
author: 'Bikebrainz'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  url:
    description: 'Target URL to scan, e.g. https://staging.example.com/'
    required: true
  fail-on:
    description: 'Severity threshold that fails the job: critical | high | medium | low | info | none'
    required: false
    default: 'high'
  ndjson:
    description: 'Emit one machine-readable NDJSON line instead of a human summary'
    required: false
    default: 'false'
  binary:
    description: 'Path to a built NullockApp binary (default: on PATH). See the example workflow for building it.'
    required: false
    default: 'NullockApp'

runs:
  using: 'composite'
  steps:
    - name: Nullock scan gate
      shell: bash
      # SECURITY: never interpolate ${{ inputs.* }} into the run: script text --
      # GitHub substitutes it before bash parses, so a runner-controllable input
      # (e.g. a fork's head_ref spliced into `url`) would be command injection
      # (CWE-78/94). Bind each input to env (a data value bash never re-parses)
      # and reference the quoted shell variable instead.
      env:
        NULLOCK_URL: ${{ inputs.url }}
        NULLOCK_FAIL_ON: ${{ inputs.fail-on }}
        NULLOCK_NDJSON: ${{ inputs.ndjson }}
        NULLOCK_BINARY: ${{ inputs.binary }}
      run: |
        args=( --scan "$NULLOCK_URL" --fail-on "$NULLOCK_FAIL_ON" )
        if [ "$NULLOCK_NDJSON" = "true" ]; then args+=( --ndjson ); fi
        echo "::group::nullock --scan $NULLOCK_URL --fail-on $NULLOCK_FAIL_ON"
        # NullockApp exits 0 (clean) / 1 (finding >= threshold) / 2 (bad URL);
        # the nonzero exit fails this step, and therefore the job.
        "$NULLOCK_BINARY" "${args[@]}"
        code=$?
        echo "::endgroup::"
        exit $code
