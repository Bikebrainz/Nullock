name: release

# Builds installer artifacts on every tag matching v*.*.* and uploads them to a
# GitHub Release. Provides the download targets the docs portal links to.
#
# Tag a release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Outputs (per platform):
#   Windows : Nullock-1.0.0-win64.exe   (NSIS installer)
#             Nullock-1.0.0-win64.zip   (portable)
#   Linux   : Nullock-1.0.0-Linux.deb
#             Nullock-1.0.0-Linux.rpm
#             Nullock-x86_64.AppImage
#   macOS   : Nullock-1.0.0-Darwin.dmg
#
# CODE SIGNING + NOTARIZATION are wired but OPTIONAL: each signing step runs
# unconditionally and no-ops inside its own script when the relevant secret is
# empty (the secrets context is NOT allowed in step `if:`, so a script guard is
# used instead). With no certs configured the release builds and uploads
# UNSIGNED exactly as before. Add the repo secrets documented in
# RELEASE_SIGNING.md and the same workflow signs Windows builds and codesigns +
# notarizes the macOS app -- no YAML change required to turn it on.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  QT_VERSION: 6.10.3

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # qtwebsockets is the only add-on module we need; Quick Controls ship
          # in the base qtdeclarative install (qtquickcontrols2 is NOT a separate
          # Qt6 aqt module -- requesting it makes aqt fail and breaks the build).
          modules: 'qtwebsockets'
      - name: install nghttp2
        run: vcpkg install nghttp2:x64-windows openssl:x64-windows
      - name: install NSIS
        run: choco install nsis -y
      - name: configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DNULLOCK_NGHTTP2_ROOT="C:/vcpkg/installed/x64-windows"
      - name: build
        run: cmake --build build --config Release --target NullockApp
      - name: sign app (no-op without WINDOWS_CERT_* secrets)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) { Write-Host "no WINDOWS_CERT_BASE64; skipping signing"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP nullock-cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          $exe = Get-ChildItem build -Recurse -Filter NullockApp.exe | Select-Object -First 1 -ExpandProperty FullName
          try {
            & $signtool sign /f $pfx /p $env:CERT_PW /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exe
            if ($LASTEXITCODE -ne 0) { throw "Application signing failed ($LASTEXITCODE)" }
            & $signtool verify /pa $exe
            if ($LASTEXITCODE -ne 0) { throw "Application signature verification failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item -LiteralPath $pfx
          }
      - name: verify staged Windows runtime
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python scripts/runtime_regression.py stage/bin/NullockApp.exe --gui --installed
      - name: package
        working-directory: build
        run: cpack -G "NSIS;ZIP" -C Release
      - name: sign installer (no-op without WINDOWS_CERT_* secrets)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) { Write-Host "no WINDOWS_CERT_BASE64; skipping signing"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP nullock-cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          try {
            Get-ChildItem build\Nullock-*-win64.exe | ForEach-Object {
              & $signtool sign /f $pfx /p $env:CERT_PW /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Installer signing failed ($LASTEXITCODE)" }
              & $signtool verify /pa $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed ($LASTEXITCODE)" }
            }
          } finally {
            Remove-Item -LiteralPath $pfx
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/Nullock-*-win64.exe
            build/Nullock-*-win64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets'
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential \
            libnghttp2-dev libssl-dev patchelf libxcb-cursor0 \
            rpm dpkg-dev imagemagick wget
      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build -j 4
      - name: verify staged Linux runtime
        run: |
          cmake --install build --prefix "$PWD/runtime-stage"
          QT_QPA_PLATFORM=offscreen python3 scripts/runtime_regression.py runtime-stage/bin/NullockApp --gui --installed
      - name: cpack -- DEB / RPM / TGZ
        working-directory: build
        run: cpack -G "DEB;RPM;TGZ"
      - name: stage for AppImage
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
      - name: AppImage
        # Every advertised artifact must build before a release is created.
        run: bash packaging/appimage/build_appimage.sh stage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/Nullock-*-Linux.deb
            build/Nullock-*-Linux.rpm
            build/Nullock-*-Linux.tar.gz
            *.AppImage

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets'
      - name: install nghttp2
        run: brew install nghttp2 openssl@3
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: build
        run: cmake --build build -j 4
      - name: stage complete macOS app
        run: |
          cmake --install build --prefix "$PWD/stage"
          QT_QPA_PLATFORM=offscreen python3 scripts/runtime_regression.py stage/NullockApp.app/Contents/MacOS/NullockApp --gui --installed
      - name: import signing cert (no-op without MACOS_CERT_* secrets)
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then echo "no MACOS_CERT_BASE64; skipping signing"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain"
          KC_PW="ci-$RANDOM"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC"
          rm "$RUNNER_TEMP/cert.p12"
      - name: codesign app (no-op without MACOS_CERT_* secrets)
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_BASE64 }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERT_B64" ]; then echo "no MACOS_CERT_BASE64; skipping codesign"; exit 0; fi
          APP="$PWD/stage/NullockApp.app"
          echo "signing $APP"
          codesign --deep --force --options runtime --timestamp --sign "$SIGN_ID" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
      - name: package the verified and optionally signed macOS app
        run: |
          VER=$(sed -n 's/^    VERSION \(.*\)/\1/p' CMakeLists.txt | head -1)
          ln -s /Applications stage/Applications
          hdiutil create -volname Nullock -srcfolder stage -ov -format UDZO "build/Nullock-${VER}-Darwin.dmg"
      - name: notarize + staple dmg (no-op without AC_API_* secrets)
        env:
          AC_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_ISSUER: ${{ secrets.AC_API_ISSUER }}
          AC_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          if [ -z "$AC_KEY" ]; then echo "no AC_API_KEY; skipping notarization"; exit 0; fi
          echo "$AC_KEY" > "$RUNNER_TEMP/ac_key.p8"
          DMG=$(find build -name 'Nullock-*-Darwin.dmg' | head -1)
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/ac_key.p8" --key-id "$AC_KEY_ID" --issuer "$AC_ISSUER" --wait
          xcrun stapler staple "$DMG"
          rm "$RUNNER_TEMP/ac_key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/Nullock-*-Darwin.dmg

  release:
    # Manual branch runs build artifacts for review; only version tags release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: tag matches package version
        run: |
          VER=$(sed -n 's/^    VERSION \(.*\)/\1/p' CMakeLists.txt | head -1)
          test "$GITHUB_REF_NAME" = "v$VER"
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: list artifacts
        run: find artifacts -type f
      - name: release notes + checksums
        # Curated release body from this version's CHANGELOG section (the headline
        # highlights) instead of only the auto-generated commit list; plus a
        # SHA256SUMS.txt so downloaders can verify each installer's integrity.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Literal index() matching (not regex) so the [ ] in the version header
          # aren't parsed as a character class.
          awk -v v="$VER" '
            index($0, "## [" v "]") == 1 {p=1; print; next}
            p && index($0, "## [") == 1 {exit}
            p {print}
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          [ -s RELEASE_NOTES.md ] || printf '## Nullock %s\n' "$VER" > RELEASE_NOTES.md
          : > SHA256SUMS.txt
          while IFS= read -r f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> SHA256SUMS.txt
          done < <(find artifacts -type f -name 'Nullock-*' | sort)
          echo "----- RELEASE_NOTES.md -----"; cat RELEASE_NOTES.md
          echo "----- SHA256SUMS.txt -----";   cat SHA256SUMS.txt
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          # Staged as a DRAFT: CI builds + attaches all three platforms' installers,
          # then a maintainer reviews the artifacts and clicks Publish. Flip to
          # false once the release flow is trusted for hands-off publishing.
          draft: true
          # Curated highlights first (from CHANGELOG); the auto-generated commit
          # list is appended below them.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # ** (recursive) because the Linux artifact preserves its build/ dir
          # (artifacts/linux/build/Nullock-*.deb) while windows/macos sit flat --
          # a single-level `*` matched the build/ directory, not the files, and
          # silently dropped every Linux installer.
          files: |
            artifacts/windows/**
            artifacts/linux/**
            artifacts/macos/**
            SHA256SUMS.txt
