name: docs-site

# Publishes /docs as a GitHub Pages site on every push to Nullock.
# Marketplace catalog gets mirrored from extensions/ -> docs/marketplace/
# automatically so the static site stays in sync.

on:
  push:
    branches: [Nullock]
    paths:
      - 'docs/**'
      - 'extensions/marketplace.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mirror marketplace catalog
        run: |
          mkdir -p docs/marketplace
          cp extensions/marketplace.json docs/marketplace/marketplace.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
