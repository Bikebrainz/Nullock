name: ci

on:
  push:
    branches: [Nullock]
  pull_request:
    branches: [Nullock]
  workflow_dispatch:

env:
  QT_VERSION: 6.7.3

jobs:
  marketplace-json:
    name: marketplace.json schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jq is installed
        run: jq --version
      - name: marketplace.json parses
        run: jq -e '.version, .updated, (.extensions | length > 0)' extensions/marketplace.json
      - name: every extension has required fields
        run: |
          jq -e '
            .extensions
            | all(
                (has("id")      and (.id      | type) == "string") and
                (has("name")    and (.name    | type) == "string") and
                (has("summary") and (.summary | type) == "string") and
                (has("version") and (.version | type) == "string") and
                (has("author")  and (.author  | type) == "string") and
                (has("url")     and (.url     | startswith("https://")))
              )
          ' extensions/marketplace.json
      # The sha256 is the only thing between a compromised CDN and arbitrary
      # code running inside a user's proxy, so an entry without a well-formed
      # one must fail the build rather than ship as an unverifiable install.
      - name: every extension pins a well-formed sha256
        run: |
          jq -e '
            .extensions
            | all(
                has("sha256") and
                (.sha256 | type) == "string" and
                (.sha256 | test("^[0-9a-f]{64}$"))
              )
          ' extensions/marketplace.json
      # ...and that hash must match the .js actually committed next to it. A
      # drifted hash breaks every install, and the tempting "fix" for that is to
      # stop verifying -- so catch the drift here instead.
      - name: manifest hashes match the committed extensions
        run: bash scripts/marketplace_sync.sh --check
      - name: docs site mirror is up to date
        run: diff -q extensions/marketplace.json docs/marketplace/marketplace.json
      # The marketplace site pages are GENERATED from the catalog + extension
      # source. Every field is escaped once at generation, so there is no runtime
      # string-to-HTML path a hostile catalog entry could reach. If a catalog or
      # extension edit is not regenerated, the committed pages drift -- and a
      # stale page could show wrong metadata or an outdated source listing. Fail
      # the build on drift, same contract as the manifest hashes above.
      - name: marketplace site pages are regenerated
        run: python3 scripts/marketplace_site.py --check
      # The parity roadmap page is generated from docs/roadmap/parity.json. When a
      # commit closes a Burp-parity gap it updates that item's state in the JSON;
      # if the page is not regenerated, "what's left" on the public roadmap is
      # wrong. Fail on drift, same contract as the marketplace generators.
      - name: parity roadmap page is regenerated
        run: python3 scripts/parity_report.py --check
      # The labs site is generated from labs/README.md + each lab's app.py
      # docstring + .nullock-project.json. A lab added, renamed, or re-described
      # without regenerating leaves the public catalog wrong. Same drift gate.
      - name: labs site pages are regenerated
        run: python3 scripts/labs_site.py --check

  python-labs:
    name: labs syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: every lab compiles
        run: |
          for lab in labs/*/app.py; do
            python -m py_compile "$lab"
          done

  cli-smoke:
    name: nullock CLI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n bin/nullock

  build-windows:
    name: build NullockApp (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # qtwebsockets is the only add-on module we need. qtquickcontrols2 is
          # NOT a separate aqt module in Qt6 -- it ships in the base qtdeclarative
          # install -- and requesting it made aqt fail ("packages not found"),
          # which broke the whole Windows build. Sql / Network / Concurrent /
          # Quick Controls are all in the base install.
          modules: 'qtwebsockets'
      - name: install nghttp2 (vcpkg)
        run: |
          vcpkg install nghttp2:x64-windows
      - name: configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DNULLOCK_NGHTTP2_ROOT="C:/vcpkg/installed/x64-windows" `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
      - name: build NullockApp
        run: cmake --build build --config Release --target NullockApp
      - name: build standalone tools (nullock-oast, nullock-workspace)
        # Compile-coverage for the deployable Src/Tools binaries -- they're not
        # part of NullockApp, so without this a build regression in them would
        # go unnoticed (as a stale test target once did).
        run: cmake --build build --config Release --target nullock-oast nullock-workspace
      # ci_gate_logic and template_request_logic joined this list deliberately: both
      # are PURE (Qt6::Core only, no sockets, no event loop), so they are as fast and
      # deterministic as the rest, and both now guard properties that fail SILENTLY.
      # ci_gate_logic pins "a scan that never ran is not a pass" -- the gate reported
      # PASS/exit 0 at every threshold for an unreachable target. template_request
      # pins that auto-headers defer to the EMITTED header name, so the tool cannot
      # forge a duplicate/conflicting Content-Length. Live-socket suites (e.g.
      # port_scan_live) stay OUT of this list on purpose -- they flake on runners.
      # extension_perms_logic and extensions_api_grant join for the same reason as
      # the rest: fast, deterministic, no sockets. extensions_api_grant drives a
      # real QJSEngine but only touches a QStandardPaths TEST-MODE sandbox, never
      # a real extensions dir. Both guard the permission model, where the DECISION
      # was always right and the ENFORCEMENT leaked -- a class of bug the pure
      # tests provably could not see. Live-socket suites (port_scan_live) stay OUT.
      - name: regression tests (scanner + CVE DB + enricher + gate + template + extensions)
        run: |
          cmake --build build --config Release --target scanner_regression_test cve_database_test finding_enricher_test request_export_test intruder_engine_test ci_gate_logic_test template_request_logic_test extension_perms_logic_test extensions_api_grant_test
          ctest --test-dir build -C Release -R "scanner_regression|cve_database|finding_enricher|request_export|intruder_engine|ci_gate_logic|template_request_logic|extension_perms_logic|extensions_api_grant" --output-on-failure
      - name: smoke
        # httpbin is flaky; allow up to one failure.
        run: |
          $out = .\build\Src\App\Release\NullockApp.exe --smoke-test
          $out | Out-String
          $fails = ($out | Select-String "^FAIL").Count
          if ($fails -gt 1) { exit 1 }
      - name: active-probe smoke
        # Deterministic active-probe regression (SSPP / host-header / LDAP /
        # HTTP/3) against in-process Python mocks. Reliable (randomized ports,
        # threaded) unlike the PS-HttpListener validate_v3. shell:bash uses the
        # git-bash that ships on the windows runner; python is on PATH there.
        shell: bash
        run: bash scripts/probe_smoke.sh "build/Src/App/Release/NullockApp.exe"

  build-linux:
    name: build NullockApp (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets'
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential \
            libnghttp2-dev libssl-dev
      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build (guards cross-platform compile/link regressions)
        # The app had only ever been built on Windows until the v3.7.0 release
        # surfaced a stack of Linux portability breaks (Qt6::ZlibPrivate absent,
        # GNU-ld static-lib link order, a hardcoded Windows nghttp2 path, a
        # case-sensitive Tests/fuzz path, ...). This job catches a Linux
        # compile/link regression before it reaches a release. It mirrors the
        # proven-green release build-linux configure+build; running ctest on
        # Linux is a follow-up (not yet validated there).
        run: cmake --build build -j

  fuzz-corpus-replay:
    name: replay fuzz corpus (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: skip if no corpus
        run: |
          if [ ! -d Tests/fuzz/corpus ] || [ -z "$(ls -A Tests/fuzz/corpus 2>/dev/null)" ]; then
            echo "no fuzz corpus checked in -- skipping (intended)"
            exit 0
          fi
          echo "corpus replay would happen here once corpus is checked in"
          # NULLOCK_FUZZ + standalone-driver build steps go here in a
          # future iteration -- currently the fuzz harnesses build but
          # the corpus is gitignored.
