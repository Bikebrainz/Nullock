name: ci

on:
  push:
    branches: [Nullock]
  pull_request:
    branches: [Nullock]
  workflow_dispatch:

env:
  QT_VERSION: 6.7.3

jobs:
  marketplace-json:
    name: marketplace.json schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jq is installed
        run: jq --version
      - name: marketplace.json parses
        run: jq -e '.version, .updated, (.extensions | length > 0)' extensions/marketplace.json
      - name: every extension has required fields
        run: |
          jq -e '
            .extensions
            | all(
                (has("id")      and (.id      | type) == "string") and
                (has("name")    and (.name    | type) == "string") and
                (has("summary") and (.summary | type) == "string") and
                (has("version") and (.version | type) == "string") and
                (has("author")  and (.author  | type) == "string") and
                (has("url")     and (.url     | startswith("https://")))
              )
          ' extensions/marketplace.json
      # The sha256 is the only thing between a compromised CDN and arbitrary
      # code running inside a user's proxy, so an entry without a well-formed
      # one must fail the build rather than ship as an unverifiable install.
      - name: every extension pins a well-formed sha256
        run: |
          jq -e '
            .extensions
            | all(
                has("sha256") and
                (.sha256 | type) == "string" and
                (.sha256 | test("^[0-9a-f]{64}$"))
              )
          ' extensions/marketplace.json
      # ...and that hash must match the .js actually committed next to it. A
      # drifted hash breaks every install, and the tempting "fix" for that is to
      # stop verifying -- so catch the drift here instead.
      - name: manifest hashes match the committed extensions
        run: bash scripts/marketplace_sync.sh --check
      - name: served UI integrity and site links
        run: python3 scripts/check_web_assets.py
      - name: browser data lifecycle regression
        run: node Tests/ui/real_data_test.cjs
      - name: docs site mirror is up to date
        run: diff -q extensions/marketplace.json docs/marketplace/marketplace.json
      # The marketplace site pages are GENERATED from the catalog + extension
      # source. Every field is escaped once at generation, so there is no runtime
      # string-to-HTML path a hostile catalog entry could reach. If a catalog or
      # extension edit is not regenerated, the committed pages drift -- and a
      # stale page could show wrong metadata or an outdated source listing. Fail
      # the build on drift, same contract as the manifest hashes above.
      - name: marketplace site pages are regenerated
        run: python3 scripts/marketplace_site.py --check
      # The parity roadmap page is generated from docs/roadmap/parity.json. When a
      # commit closes a Burp-parity gap it updates that item's state in the JSON;
      # if the page is not regenerated, "what's left" on the public roadmap is
      # wrong. Fail on drift, same contract as the marketplace generators.
      - name: parity roadmap page is regenerated
        run: python3 scripts/parity_report.py --check
      # The labs site is generated from labs/README.md + each lab's app.py
      # docstring + .nullock-project.json. A lab added, renamed, or re-described
      # without regenerating leaves the public catalog wrong. Same drift gate.
      - name: labs site pages are regenerated
        run: python3 scripts/labs_site.py --check

  python-labs:
    name: labs syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: every lab compiles
        run: |
          for lab in labs/*/app.py; do
            python -m py_compile "$lab"
          done

  cli-smoke:
    name: nullock CLI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n bin/nullock

  build-windows:
    name: build NullockApp (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # qtwebsockets is the only add-on module we need. qtquickcontrols2 is
          # NOT a separate aqt module in Qt6 -- it ships in the base qtdeclarative
          # install -- and requesting it made aqt fail ("packages not found"),
          # which broke the whole Windows build. Sql / Network / Concurrent /
          # Quick Controls are all in the base install.
          modules: 'qtwebsockets'
      - name: install nghttp2 (vcpkg)
        run: |
          vcpkg install nghttp2:x64-windows openssl:x64-windows
      - name: configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DNULLOCK_NGHTTP2_ROOT="C:/vcpkg/installed/x64-windows" `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
      - name: build NullockApp
        run: cmake --build build --config Release --target NullockApp
      - name: build standalone tools (nullock-oast, nullock-workspace)
        # Compile-coverage for the deployable Src/Tools binaries -- they're not
        # part of NullockApp, so without this a build regression in them would
        # go unnoticed (as a stale test target once did).
        run: cmake --build build --config Release --target nullock-oast nullock-workspace
      - name: build and run every regression suite
        run: |
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --output-on-failure --parallel 4
      - name: Windows checkout integrity
        run: python scripts/check_web_assets.py
      - name: application lifecycle and wire fidelity
        run: python scripts/runtime_regression.py build/Src/App/Release/NullockApp.exe
      - name: reporting integration
        run: ./scripts/integration_smoke.ps1 -exe build/Src/App/Release/NullockApp.exe
      - name: install browser test dependencies
        run: |
          npm ci --prefix Tests/ui
          ./Tests/ui/node_modules/.bin/playwright install chromium
      - name: every browser tool opens
        run: node Tests/ui/browser_test.cjs build/Src/App/Release/NullockApp.exe
      - name: staged runtime without developer PATH
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python scripts/runtime_regression.py stage/bin/NullockApp.exe
      - name: smoke
        # httpbin is flaky; allow up to one failure.
        run: |
          $out = .\build\Src\App\Release\NullockApp.exe --smoke-test
          $out | Out-String
          $fails = ($out | Select-String "^FAIL").Count
          if ($fails -gt 1) { exit 1 }
      - name: active-probe smoke
        # Deterministic active-probe regression (SSPP / host-header / LDAP /
        # HTTP/3) against in-process Python mocks. Reliable (randomized ports,
        # threaded) unlike the PS-HttpListener validate_v3. shell:bash uses the
        # git-bash that ships on the windows runner; python is on PATH there.
        shell: bash
        run: bash scripts/probe_smoke.sh "build/Src/App/Release/NullockApp.exe"

  build-linux:
    name: build NullockApp (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets'
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential \
            libnghttp2-dev libssl-dev patchelf libxcb-cursor0
      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build (guards cross-platform compile/link regressions)
        # The app had only ever been built on Windows until the v3.7.0 release
        # surfaced a stack of Linux portability breaks (Qt6::ZlibPrivate absent,
        # GNU-ld static-lib link order, a hardcoded Windows nghttp2 path, a
        # case-sensitive Tests/fuzz path, ...). This job catches a Linux
        # compile/link regression before it reaches a release. It mirrors the
        # proven-green release build-linux configure+build; running ctest on
        # Linux is validated below alongside the installed runtime.
        run: cmake --build build -j 4
      - name: runtime regression suites
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: install and verify application assets and runtime
        run: |
          cmake --install build --prefix "$PWD/stage"
          if [ "$(uname)" = Darwin ]; then
            APP="$PWD/stage/NullockApp.app/Contents/MacOS/NullockApp"
          else
            APP="$PWD/stage/bin/NullockApp"
          fi
          QT_QPA_PLATFORM=offscreen python3 scripts/runtime_regression.py "$APP"

  build-macos:
    name: build NullockApp (macOS)
    runs-on: macos-14
    # macOS had NO per-push coverage: the app is only built for macOS in
    # release.yml, which fires on v*.*.* tags -- so the last time a macOS build
    # ran at all was the v3.7.0 tag. Weeks of development could regress the macOS
    # compile with nothing to catch it (a real user hit exactly this). This job
    # mirrors release.yml's build-macos configure+build (minus signing/DMG) so a
    # macOS compile/link break is caught on every push, the same guarantee Linux
    # and Windows already have.
    steps:
      - uses: actions/checkout@v4
      - name: install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets'
      - name: install nghttp2
        run: brew install nghttp2
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: build (guards macOS compile/link regressions)
        run: cmake --build build -j 4
      - name: runtime regression suites
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: install and verify application assets and runtime
        run: |
          cmake --install build --prefix "$PWD/stage"
          if [ "$(uname)" = Darwin ]; then
            APP="$PWD/stage/NullockApp.app/Contents/MacOS/NullockApp"
          else
            APP="$PWD/stage/bin/NullockApp"
          fi
          QT_QPA_PLATFORM=offscreen python3 scripts/runtime_regression.py "$APP"

  fuzz-corpus-replay:
    name: sanitized parser corpus replay
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets'
      - name: dependencies
        run: sudo apt-get update && sudo apt-get install -y libnghttp2-dev libssl-dev patchelf libxcb-cursor0 ninja-build
      - name: build instrumented standalone harnesses
        run: |
          cmake -B build -G Ninja -DNULLOCK_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --target fuzz_http1_parser fuzz_har_import fuzz_ws_parser -j 4
      - name: replay all committed seeds
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: halt_on_error=1
        run: python3 scripts/replay_fuzz_corpus.py build

  build-docker:
    name: build Docker image
    runs-on: ubuntu-latest
    # The root Dockerfile shipped with a "not yet validated with `docker
    # build`" self-disclaimer -- nothing in CI ever actually built it, so a
    # broken multi-stage build (a bad aqtinstall module name, a missing
    # runtime .so, a COPY --from typo) could sit unnoticed indefinitely. This
    # job builds the real multi-stage image on every push and then runs the
    # resulting binary's `--help` path (deterministic, no network/proxy
    # binds, no API token needed) to prove the runtime stage actually
    # executes -- not just that the layers copied.
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t nullock:ci .
      - name: runtime smoke (--help, no listeners/token required)
        run: docker run --rm nullock:ci --help
      - name: authenticated container service
        env:
          NULLOCK_API_TOKEN: ci-local-fixture-token
        run: |
          docker run -d --name nullock-service -p 127.0.0.1::17777 -e NULLOCK_API_TOKEN nullock:ci --no-update-check
          PORT=$(docker port nullock-service 17777/tcp | sed 's/.*://')
          python3 scripts/container_smoke.py "http://127.0.0.1:$PORT"
          test "$(docker wait nullock-service)" = 0
      - name: container diagnostics and cleanup
        if: always()
        run: |
          docker logs nullock-service 2>/dev/null || true
          docker rm -f nullock-service 2>/dev/null || true
