<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Nullock Companion -- Settings</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px;
    font: 13px -apple-system, system-ui, sans-serif;
    background: #0d0d12; color: #d0d0d6;
    max-width: 540px;
  }
  h1 { color: #b7a3d6; font-size: 18px; margin: 0 0 16px; }
  label { display: block; margin-top: 12px; color: #888; }
  input[type=text], input[type=number] {
    width: 100%; box-sizing: border-box;
    background: #1c1c24; color: #e0e0e6;
    border: 1px solid #2a2a35; border-radius: 4px;
    padding: 6px 8px;
  }
  button {
    margin-top: 18px; padding: 8px 16px;
    background: linear-gradient(135deg, #9d4edd 0%, #5a189a 100%);
    color: white; border: none; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  .ok { color: #4ade80; margin-left: 12px; }
  .help { font-size: 11px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<h1>Nullock Companion -- Settings</h1>

<label>Proxy host
  <input id="proxyHost" type="text" />
  <div class="help">Usually 127.0.0.1. Use the host of the box running Nullock if you're driving it from a different machine on the LAN.</div>
</label>
<label>Proxy port
  <input id="proxyPort" type="number" min="1" max="65535" />
  <div class="help">Default 8080. Matches Nullock's --proxy-port.</div>
</label>
<label>Control port
  <input id="controlPort" type="number" min="1" max="65535" />
  <div class="help">Default 17777. Matches Nullock's --control-port. Used for status pings + CA download.</div>
</label>
<label>Bypass list (one host per line)
  <textarea id="bypassList" rows="4" style="width:100%; box-sizing:border-box; background:#1c1c24; color:#e0e0e6; border:1px solid #2a2a35; border-radius:4px; padding:6px 8px;"></textarea>
  <div class="help">Hosts that skip the proxy. Add anything you don't want to MITM (banking, corporate auth).</div>
</label>
<button id="save">Save</button>
<span class="ok" id="saved"></span>

<script src="options.js"></script>
</body>
</html>
